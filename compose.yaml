services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - database:/data
    environment:
      DOMAIN: ${DOMAIN:-http://localhost:8090}
      ACCOUNT_DOMAINS: ${ACCOUNT_DOMAINS:?set permitted account email domains}
      REGISTRATION_DOMAINS: ${REGISTRATION_DOMAINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    stop_grace_period: 15s

  # Optional S3-compatible object storage for local development.
  garage:
    profiles: [storage]
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: on-failure
    command: /garage server --single-node --default-bucket
    volumes:
      - garage:/var/lib/garage
    configs:
      - source: garage
        target: /etc/garage.toml
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: development
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/metadata"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"

volumes:
  database:
  garage:
