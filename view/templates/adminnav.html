{{ define "admin-navigation" }}
  <nav class="app-section-nav" aria-label="Seiten der Verwaltung">
    {{ range .Groups }}
      <h2 class="app-subnav-theme">{{ .Title }}</h2>
      <ul class="govuk-list app-subnav">
        {{ range .Links }}
          <li>
            <a
              class="govuk-link govuk-link--no-visited-state govuk-link--no-underline"
              href="{{ .URL }}"
              {{ if eq $.Section .ID }}
                aria-current="{{- if or (eq $.View "form") (eq $.View "settings-readonly") (eq $.View "user") (eq $.View "review") (eq $.View "reset") (eq $.View "regulation") -}}
                  true
                {{- else -}}
                  page
                {{- end -}}"
              {{ end }}
              >{{ .Label }}</a
            >
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </nav>
{{ end }}
